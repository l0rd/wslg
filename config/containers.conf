# Podman engine configuration for the WSLC system distro.

[engine]
# Stage temporary image content (e.g. the archive built by the Docker-compatible
# GET /images/{name}/get and /images/get endpoints) under the storage graphroot,
# i.e. /var/lib/containers/tmp on the per-session storage.vhdx, instead of the
# default /var/tmp on the system distro's small root. dockerd streams image
# exports, so large images would otherwise fail to save with ENOSPC under Podman.
# Podman creates the directory on demand. Only used when TMPDIR is unset, which
# is the case for the podman system service started by wslcsession.
image_copy_tmp_dir = "storage"
